<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHALA V2 — Functional Journey</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd;font:14px Arial;color:#111}.app{width:min(390px,100%);min-height:100vh;margin:auto;background:#fafafa}.bar{padding:12px;border-bottom:2px solid #111;display:flex;justify-content:space-between}.page{padding:16px;min-height:720px}.box,.btn,input{border:2px solid #111;background:#fff;padding:12px;margin:8px 0}.btn{width:100%;cursor:pointer}.yes{background:#dff2df}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.image{height:220px;display:flex;align-items:center;justify-content:center}.gate{position:fixed;inset:0;background:#111;color:#fff;z-index:9;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.compact{border:4px solid #111;border-radius:45% 45% 20% 20%;padding:24px 16px;text-align:center}.msg{padding:8px;border:2px dashed #111}input{width:100%}</style></head><body><main class="app"><header class="bar"><b>SHALA · V2</b><span id="label"></span></header><section id="view" class="page"></section></main><script type="module">import{createV2State,go,openContext,returnContext,setFaceSource,setMetricProfile,setBodyOverride,selectPose,selectStudio,setDomain,nextDomain,setReference,toggleReference,skipDomain,startAgain,setOrientationGate,DOMAINS,POSES,STUDIOS}from'./src/v2/state-engine.js';const s=createV2State(),V=document.querySelector('#view'),L=document.querySelector('#label');const B=(label,act,yes=false)=>`<button class="btn ${yes?'yes':''}" data-act="${act}">${label}</button>`;const img=t=>`<div class="box image">${t}</div>`;const studios=['indoor office','indoor living room','indoor disco','outdoor sunny patio','outdoor golden hour',"Rasyela's Studio"];function nav(p){go(s,p);draw()}function render(){const p=s.page,m={};m['SPLASH']=`<h1>SHALA</h1>${img('page 1')}${B('tap me','ded')}`;m['DEDICATION']=`<h1>Ang app para kay RASYELA</h1>${img('page 2')}${B('continue','login',true)}`;m['LOGIN']=`<h1>Login</h1><input id="user" placeholder="username"><input id="pass" type="password" placeholder="password">${B('open sesame','loginok',true)}${B('sign me up!','register')}${B('I forgot!','forgot')}`;m['REGISTER ACCOUNT']=`<h1>Register Account</h1><input placeholder="name me"><input placeholder="lock me"><input placeholder="double check me">${B('all done!','registered',true)}${B('bring me back','login')}`;m['FORGOT PASSWORD']=`<h1>Forgot Password</h1><input placeholder="enter magic words">${B('pray this works','recovery',true)}${B('bring me back','login')}`;m['DASHBOARD TEASER']=`<h1>Dashboard Teaser</h1>${B('envelop clipart','birthday')}`;m['BIRTHDAY GREETING']=`<h1>Birthday Greeting</h1>${B('heart icon','dashboard',true)}`;m['MAIN DASHBOARD']=`<div class="compact"><h1>Compact</h1>${B('mirror on the wall','create')}${B('explore','workshop')}${B('trends','trends')}${B('favorites','favorites')}</div>`;m['CREATE ME — FACE']=`<h1>Create Me — Face</h1>${img(s.profile.faceSource||'face source')}${B('upload face','faceupload')}${B('take a pic','facecamera')}${B('use this pic','faceok',true)}`;m['CREATE ME — VITAL STATISTICS']=`<h1>Vital Statistics</h1><input id="h" placeholder="height cm"><input id="w" placeholder="weight kg"><input id="b" placeholder="bust cm"><input id="wa" placeholder="waist cm"><input id="hi" placeholder="hips cm">${B('this looks right','statsok',true)}`;m['IDENTITY GENERATING']=`<h1>ALBUS is doing the math...</h1>${img('deterministic Canon resolution')}${B('continue','canon',true)}`;m['CANON CONFIRMATION']=`<h1>Does this resemble you?</h1>${img('CANON')}${B('spot on!','canonyes',true)}${B('not quite','canonno')}`;m['DOUBLE CONFIRM']=`<h1>Really, gurl?</h1>${B('NA-AH!','safe-return')}${B('Fine!','canonyes')}${B('the body tho','body',true)}`;m['BODY SELF-SELECTION']=`<h1>Body Self-Selection</h1><div class="grid">${Array.from({length:7},(_,i)=>B('body'+(i+1),'body-'+(i+1))).join('')}</div>${B('yes pls','bodyok',true)}${B('pick again','body')}`;m['WORKSHOP']=`<h1>What are we trying on?</h1>${DOMAINS.map(d=>B('TRY ME '+d,'domain-'+d)).join('')}${B('choose pose','pose',true)}${B('compact','compact')}`;m['POSE SELECTION']=`<h1>Pose Selection</h1><div class="grid">${POSES.map((p,i)=>B('pose'+(i+1),'pose-'+p)).join('')}</div>${B('yes pls','poseok',true)}${B('pick again','pose')}${B('compact','compact')}`;m['STUDIO SELECTION']=`<h1>Studio Selection</h1><div class="grid">${STUDIOS.map((x,i)=>B(studios[i],'studio-'+x)).join('')}</div>${B('yes pls','studiook',true)}${B('pick again','studio')}${B('compact','compact')}`;for(const d of DOMAINS)m[d]=`<h1>${d}</h1>${img(s.build.currentRootMediaId||'CURRENT ROOT / IMAGE PROVISION')}<p>Reference: ${s.build.references[d]||'none'}</p>${B('upload icon','ref-'+d)}${B('camera icon','refcam-'+d)}${B('slap it','gen-deferred',true)}${B('swap','ref-'+d)}${B('skip','skip')}${B('reference toggle','toggle')}${B('compact','compact')}`;m['ALBUS GENERATING']=`<h1>ALBUS is doing the math...</h1><p>Transformation API is a 2D concern.</p>`;m['THE REVEAL']=`<h1>The Reveal</h1>${img(s.build.currentRootMediaId||s.build.candidateMediaId||'IMAGE Y')}${B('heart icon','favorite')}${B('download icon','download')}${B('refresh icon','start')}${B('compact','compact')}${B('reference toggle','toggle')}`;m['TREND ALERT']=`<h1>Trend Alert</h1>${img('Trend engine deferred by contract')}${B('roll again','trend-deferred')}${B("that's interesting",'dashboard',true)}${B('compact','compact')}`;m['FAVORITES']=`<h1>Favorites</h1>${img('favorite 1')}${img('favorite 2')}${img('favorite 3')}${B('compact','compact')}${B('view toggle','view')}${B('download icon','download')}`;m['COMPACT UNDERSIDE']=`<h1>Compact Underside</h1>${B('compact','return',true)}${B('no-no button','safe-return')}`;return m[p]||'<h1>Unknown</h1>'}function gate(){document.querySelector('.gate')?.remove();const mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||matchMedia('(hover:none) and (pointer:coarse)').matches;const portrait=innerHeight>innerWidth;if(setOrientationGate(s,{mobile,portrait})){const g=document.createElement('div');g.className='gate';g.innerHTML='<div><h2>Shift to landscape mode</h2><p>Rotate your phone to continue.</p></div>';document.body.append(g)}}function draw(){L.textContent=s.page;V.innerHTML=(s.transient.message?`<div class="msg">${s.transient.message}</div>`:'')+render();V.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>act(x.dataset.act));gate()}function act(a){s.transient.message=null;if(a==='ded')nav('DEDICATION');else if(a==='login'||a==='registered'||a==='recovery')nav('LOGIN');else if(a==='register')nav('REGISTER ACCOUNT');else if(a==='forgot')nav('FORGOT PASSWORD');else if(a==='loginok')nav('DASHBOARD TEASER');else if(a==='birthday')nav('BIRTHDAY GREETING');else if(a==='dashboard')nav('MAIN DASHBOARD');else if(a==='create')nav('CREATE ME — FACE');else if(a==='workshop')nav('WORKSHOP');else if(a==='trends'){openContext(s,'TREND ALERT');draw()}else if(a==='favorites'){openContext(s,'FAVORITES');draw()}else if(a==='faceupload'||a==='facecamera'){setFaceSource(s,a==='faceupload'?'uploaded-face':'camera-face');draw()}else if(a==='faceok'){if(!s.profile.faceSource){s.transient.message='Choose a face source first.';draw()}else nav('CREATE ME — VITAL STATISTICS')}else if(a==='statsok'){const ids=['h','w','b','wa','hi'].map(id=>+document.getElementById(id).value);if(ids.some(x=>!x)){s.transient.message='Complete the vital statistics.';draw()}else{setMetricProfile(s,{heightCm:ids[0],weightKg:ids[1],bustCm:ids[2],waistCm:ids[3],hipsCm:ids[4]});nav('IDENTITY GENERATING')}}else if(a==='canon')nav('CANON CONFIRMATION');else if(a==='canonyes')nav('WORKSHOP');else if(a==='canonno')nav('DOUBLE CONFIRM');else if(a==='safe-return')nav('CANON CONFIRMATION');else if(a==='body')nav('BODY SELF-SELECTION');else if(a.startsWith('body-')){setBodyOverride(s,+a.split('-')[1]);draw()}else if(a==='bodyok')nav('WORKSHOP');else if(a==='pose')nav('POSE SELECTION');else if(a.startsWith('pose-')){selectPose(s,a.slice(5));draw()}else if(a==='poseok'){if(!s.build.selectedPose){s.transient.message='Choose a pose first.';draw()}else nav('STUDIO SELECTION')}else if(a.startsWith('studio-')){selectStudio(s,a.slice(7));draw()}else if(a==='studiook'){if(!s.build.selectedStudio){s.transient.message='Choose a Studio first.';draw()}else setDomain(s,'CLOTHES'),draw()}else if(a.startsWith('domain-')){setDomain(s,a.slice(7));draw()}else if(a.startsWith('ref-')||a.startsWith('refcam-')){const d=s.build.activeDomain;setReference(s,d,`${d.toLowerCase()}-reference`);draw()}else if(a==='skip'){skipDomain(s);draw()}else if(a==='toggle'){toggleReference(s);draw()}else if(a==='compact'){openContext(s,'COMPACT UNDERSIDE');draw()}else if(a==='return'){returnContext(s);draw()}else if(a==='start'){startAgain(s);draw()}else if(['gen-deferred','trend-deferred'].includes(a)){s.transient.message='Provision retained; implementation belongs to the next authorized coordinate.';draw()}else{s.transient.message='Prototype action acknowledged.';draw()}}addEventListener('resize',gate);addEventListener('orientationchange',gate);draw();</script></body></html>
