<!doctype html><meta charset="utf-8"><title>SHALA 1D PROVE</title><pre id="out"></pre><script type="module">
import * as storage from '../src/foundation/storage.js';
import {initialState,SCREENS} from '../src/framing/state.js';
import {RED,BLUE,WORKSPACE,viewportIntent} from '../src/roughins/geometry.js';
import {WORKSHOP_DOMAINS,CORE_POSES,STUDIO_CATALOG,validateAccessorySelection} from '../src/roughins/catalogs.js';
import {GENERATION_MODE,generate} from '../src/roughins/generation-adapter.js';
import {project} from '../src/roughins/view-model.js';
import {REVEAL_ACTIONS,bootstrap,dispatch,generateCandidate} from '../src/roughins/controller.js';
import {presentation} from '../src/roughins/page-accounting.js';
import {trendAlertData,googleImagesIntent,saveToDeviceIntent} from '../src/roughins/external-intents.js';
const results=[];const eq=(a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(`${JSON.stringify(a)} != ${JSON.stringify(b)}`)};const ok=(v,m='assertion_failed')=>{if(!v)throw Error(m)};async function t(id,name,fn){try{await fn();results.push({id,name,pass:true})}catch(e){results.push({id,name,pass:false,error:e.message})}}
await storage.clearAll();
const profile={schemaVersion:1,height:65,weight:128,measurements:{bust:38,waist:31,hips:37},selectedCanonId:'CANON_01',personalizedRootMediaPointer:'root://one',birthdayGiftOpened:false};
await t('1D-01','application controller boundary',async()=>{const b=await bootstrap();ok(b&&b.state&&b.view)});
await t('1D-02','view-model projection',()=>{const s=initialState(),before=JSON.stringify(s),v=project(s);ok(v&&v.screen===SCREENS.FACE);eq(JSON.stringify(s),before)});
await t('1D-03','action dispatch seam',async()=>{const r=await dispatch(initialState(),'FACE_ACCEPTED');ok(r.ok&&r.state.screen===SCREENS.MEASUREMENTS)});
await t('1D-04','RED workspace contract',()=>eq(RED,{width:390,height:844,scrollY:true}));
await t('1D-05','BLUE workspace contract',()=>eq(BLUE,{width:1170,height:844,centerX:585,panX:true,panY:true,zoom:true}));
await t('1D-06','RED BLUE geometry constants',()=>{ok(RED.width===390&&RED.height===844&&BLUE.width===1170&&BLUE.height===844)});
await t('1D-07','BLUE centering',()=>{ok(BLUE.centerX===BLUE.width/2&&BLUE.centerX===RED.width*1.5)});
await t('1D-08','BLUE pan zoom through state no runtime repair',async()=>{ok(WORKSPACE.runtimeStudioRepair===false);eq(viewportIntent({panX:2,panY:3,zoom:1.5}),{panX:2,panY:3,zoom:1.5});const r=await dispatch(initialState(),'SET_BLUE_VIEWPORT',{panX:9,panY:4,zoom:2});ok(r.ok&&r.state.blueViewport.zoom===2)});
await t('1D-09','CREATE ME input seam',async()=>{let s=initialState();let r=await dispatch(s,'FACE_ACCEPTED');ok(r.ok);r=await dispatch(r.state,'MEASUREMENTS_ACCEPTED');ok(r.ok&&r.state.screen===SCREENS.IDENTITY_GENERATING)});
await t('1D-10','Canon selection seam',async()=>{let s=initialState();for(const e of ['FACE_ACCEPTED','MEASUREMENTS_ACCEPTED','IDENTITY_READY']){const r=await dispatch(s,e);ok(r.ok);s=r.state}const r=await dispatch(s,'CANON_YES',{profile});ok(r.ok&&r.state.screen===SCREENS.HOME)});
await t('1D-11','Compact navigation seam',async()=>{let s=(await bootstrap()).state;if(s.screen!==SCREENS.HOME){await storage.saveProfile(profile);s=(await bootstrap()).state}const r=await dispatch(s,'OPEN_WORKSHOP');ok(r.ok&&r.state.screen===SCREENS.WORKSHOP)});
await t('1D-12','Workshop domain seam',()=>eq(WORKSHOP_DOMAINS,['CLOTHES','BAGS','SHOES','ACCESSORIES']));
await t('1D-13','accessory exactly one validation',()=>{ok(validateAccessorySelection(['HAT']).ok);ok(!validateAccessorySelection([]).ok);ok(!validateAccessorySelection(['HAT','GLASSES']).ok);ok(!validateAccessorySelection(['BELT']).ok)});
await t('1D-14','exactly ten poses',()=>ok(CORE_POSES.length===10));
await t('1D-15','exactly five studios',()=>ok(STUDIO_CATALOG.length===5));
await t('1D-16','normalized studio masters 1170x844',()=>ok(STUDIO_CATALOG.every(s=>s.master.width===1170&&s.master.height===844)));
await t('1D-17','reference acquisition seam',async()=>{let s=(await bootstrap()).state;let r=await dispatch(s,'OPEN_WORKSHOP');if(!r.ok){await storage.saveProfile(profile);s=(await bootstrap()).state;r=await dispatch(s,'OPEN_WORKSHOP')}r=await dispatch(r.state,'SELECT_DOMAIN',{domain:'CLOTHES'});r=await dispatch(r.state,'SELECT_POSE',{poseId:'POSE_01'});r=await dispatch(r.state,'SELECT_STUDIO',{studioId:'STUDIO_01'});r=await dispatch(r.state,'SET_REFERENCE',{pointer:'ref://one'});ok(r.ok&&r.state.activeBuild.currentReferenceMediaPointer==='ref://one')});
await t('1D-18','SWAP seam',async()=>{let s=(await storage.loadActiveBuild());let state={...initialState(),profile,activeBuild:s,screen:SCREENS.REFERENCE};const r=await dispatch(state,'SWAP_REFERENCE',{pointer:'ref://two'});ok(r.ok&&r.state.activeBuild.currentReferenceMediaPointer==='ref://two')});
await t('1D-19','generation adapter interface',async()=>{const x=await generate({root:'r',reference:'q',domain:'CLOTHES',pose:'POSE_01',studio:'STUDIO_01'});ok(x&&typeof x.pointer==='string'&&x.mode)});
await t('1D-20','generation local stub no real AI',async()=>{const x=await generate({root:'r',reference:'q',domain:'CLOTHES',pose:'POSE_01',studio:'STUDIO_01'});ok(GENERATION_MODE==='LOCAL_STUB'&&x.mode==='LOCAL_STUB'&&x.pointer.startsWith('stub://'))});
await t('1D-21','pendingReveal durability',async()=>{let b=await storage.loadActiveBuild();let state={...initialState(),profile,activeBuild:b,screen:SCREENS.REFERENCE};let r=await generateCandidate(state);ok(r.ok);r=await dispatch(r.state,'CANDIDATE_PASS');ok(r.ok&&r.state.activeBuild.pendingReveal===true);const h=await bootstrap();ok(h.state.screen===SCREENS.REVEAL&&h.state.activeBuild.pendingReveal===true)});
await t('1D-22','exactly three Reveal actions',()=>eq(REVEAL_ACTIONS,['SAVE_TO_DEVICE','FAVORITE','TRY_ANOTHER']));
await t('1D-23','Save-to-Device boundary',()=>{const x=saveToDeviceIntent('media://one');ok(x.type==='SAVE_TO_DEVICE'&&x.pointer==='media://one')});
await t('1D-24','Favorites max three',async()=>{await storage.clearAll();await storage.addFavorite({id:1});await storage.addFavorite({id:2});await storage.addFavorite({id:3});let blocked=false;try{await storage.addFavorite({id:4})}catch(e){blocked=e.message==='favorites_limit_exceeded'}ok(blocked)});
await t('1D-25','Comparison projection',()=>{const s={...initialState(),screen:SCREENS.REVEAL,comparisonEnabled:true,activeBuild:{currentRootMediaPointer:'result',currentReferenceMediaPointer:'ref',pendingReveal:true}};const v=project(s);ok(v.comparison&&v.comparison.enabled===true)});
await t('1D-26','START AGAIN',async()=>{await storage.clearAll();await storage.saveProfile(profile);let s=(await bootstrap()).state;let r=await dispatch(s,'OPEN_WORKSHOP');ok(r.ok);r=await dispatch(r.state,'START_AGAIN');ok(r.ok&&r.state.screen===SCREENS.HOME&&(await storage.loadActiveBuild())===null&&(await storage.loadProfile())!==null)});
await t('1D-27','Nuclear Reset',async()=>{await storage.saveProfile(profile);let s=(await bootstrap()).state;const r=await dispatch(s,'NUCLEAR_RESET');ok(r.ok&&r.state.screen===SCREENS.FACE&&(await storage.loadProfile())===null)});
await t('1D-28','navigation guard',async()=>{const s={...initialState(),screen:SCREENS.GENERATING};const r=await dispatch(s,'BACK');ok(!r.ok&&r.error==='navigation_locked')});
await t('1D-29','refresh relaunch bootstrap',async()=>{await storage.clearAll();await storage.saveProfile(profile);const b={selectedDomain:'CLOTHES',selectedPoseId:null,selectedStudioId:null,currentRootMediaPointer:'root://one',currentReferenceMediaPointer:null,candidateMediaPointer:null,pendingReveal:false,comparisonEnabled:false};await storage.saveActiveBuild(b);const h=await bootstrap();ok(h.state.screen===SCREENS.POSE&&h.state.activeBuild.selectedDomain==='CLOTHES')});
await t('1D-30','Trend Alert data seam',()=>eq(trendAlertData({label:"SUNDAY'S BEST",query:'fashion'}),{label:"SUNDAY'S BEST",query:'fashion'}));
await t('1D-31','Google Images NEW_TAB seam',()=>{const x=googleImagesIntent('STREET STYLE');ok(x.type==='EXTERNAL'&&x.target==='NEW_TAB'&&x.provider==='GOOGLE_IMAGES')});
await t('1D-32','WERK transient event',async()=>{let s={...initialState(),screen:SCREENS.REVEAL,activeBuild:{selectedDomain:'CLOTHES',selectedPoseId:'POSE_01',selectedStudioId:'STUDIO_01',currentRootMediaPointer:'r',currentReferenceMediaPointer:'q',candidateMediaPointer:null,pendingReveal:true,comparisonEnabled:false}};let r=await dispatch(s,'COMPLETE_BUILD');ok(r.ok&&r.state.werk===true);r=await dispatch(r.state,'CLEAR_WERK');ok(r.ok&&r.state.werk===false)});
await t('1D-33','page accounting metadata',()=>{ok(presentation('PAGE','x').pageCount===1);for(const k of ['STATE','OVERLAY-PROMPT','EXTERNAL','SYSTEM'])ok(presentation(k,'x').pageCount===0)});
await t('1D-34','deterministic error projection',async()=>{const r=await dispatch(initialState(),'OPEN_WORKSHOP');ok(!r.ok&&r.error==='illegal_transition'&&r.state.screen===SCREENS.FACE)});
await t('1D-35','no duplicate persistence authority',async()=>{ok(typeof storage.saveProfile==='function'&&typeof storage.saveActiveBuild==='function');ok(typeof dispatch==='function')});
await t('1D-36','1E readiness projection and contracts',()=>{const v=project(initialState());ok(v&&v.screen&&RED.width===390&&BLUE.width===1170&&REVEAL_ACTIONS.length===3&&WORKSHOP_DOMAINS.length===4)});
await t('1D-37','scope containment local-only rough-ins',()=>{ok(GENERATION_MODE==='LOCAL_STUB'&&WORKSPACE.runtimeStudioRepair===false&&!WORKSHOP_DOMAINS.includes('EARRINGS')&&!WORKSHOP_DOMAINS.includes('BELTS'))});
window.__SHALA_1D_RESULTS__=results;const pass=results.filter(x=>x.pass).length;document.title=pass===37?'SHALA 1D PROVE — PASS / 37':'SHALA 1D PROVE — FAIL';document.querySelector('#out').textContent=JSON.stringify(results,null,2);
</script>
