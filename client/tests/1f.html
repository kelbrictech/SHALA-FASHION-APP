<!doctype html><html><head><meta charset="utf-8"><title>SHALA 1F CSV PROVE</title>
<style>body{font-family:system-ui;max-width:900px;margin:20px auto}.ok{color:green}.fail{color:red}pre{background:#f6f8fa;padding:12px}</style></head>
<body><h1>SHALA 1F — CSV Authority Structural PROVE</h1><div id="results"></div>
<iframe id="shell" src="/1e.html" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
(async function(){
const expected=['SPLASH','DEDICATION','LOGIN','REGISTER ACCOUNT','FORGOT PASSWORD','DASHBOARD TEASER','BIRTHDAY GREETING','COMPACT CLOSE','COMPACT OPEN','CREATE ME — FACE','CREATE ME — VITAL STATISTICS','IDENTITY GENERATING','CANON CONFIRMATION','DOUBLE CONFIRM','BODY SELF-SELECTION','WORKSHOP','POSE SELECTION','STUDIO SELECTION','CLOTHES','BAGS','SHOES','ACCESSORIES','ALBUS GENERATING','THE REVEAL','TREND ALERT','FAVORITES','COMPACT UNDERSIDE'];
const R=document.querySelector('#results');function add(n,ok,d=''){R.insertAdjacentHTML('beforeend',`<div><b>${n}:</b> <span class="${ok?'ok':'fail'}">${ok?'PASS':'FAIL'}</span>${d?`<pre>${d}</pre>`:''}</div>`)}
const f=document.querySelector('#shell');await new Promise(r=>f.onload=r);const w=f.contentWindow;
const pages=w.pages||[];add('27 CSV pages in exact order',JSON.stringify(pages)===JSON.stringify(expected),`found ${pages.length}`);
const txt=await fetch('/src/foundation/schema.js').then(r=>r.text());
add('4 fashion domains',/CLOTHES/.test(txt)&&/BAGS/.test(txt)&&/SHOES/.test(txt)&&/ACCESSORIES/.test(txt));
add('10 poses',((txt.match(/POSE_\d+/g)||[]).length)>=10);
add('6 studios incl MY_STUDIO',/MY_STUDIO/.test(txt)&&((txt.match(/STUDIO_\d+/g)||[]).length)>=5);
const shellText=await fetch('/1e.html').then(r=>r.text());
const terms=['open me','flip me','mirror on the wall','use this pic','this looks right','slap it','done here','roll again',"that's interesting",'no-no button','i understand'];
add('CSV interaction vocabulary present',terms.every(x=>shellText.toLowerCase().includes(x)),terms.filter(x=>!shellText.toLowerCase().includes(x)).join(', '));
add('Page 10/11 identity commit correction present',shellText.includes('commits the entered identity input'));
const stateText=await fetch('/src/framing/state.js').then(r=>r.text());
add('Runtime has explicit P1→P27 screens',Array.from({length:27},(_,i)=>`P${i+1}_`).every(x=>stateText.includes(x)));
add('Runtime has sequential clothes→bags→shoes→accessories stages',/nextStage=\{CLOTHES:'BAGS',BAGS:'SHOES',SHOES:'ACCESSORIES',ACCESSORIES:null\}/.test(stateText));
const fails=R.querySelectorAll('.fail').length;const h=document.createElement('h2');h.textContent=fails?`SUMMARY: ${fails} FAILURES`:'SUMMARY: ALL CHECKS PASSED';h.className=fails?'fail':'ok';R.prepend(h);window.PROVE_RESULT={failures:fails};
})();
</script></body></html>
