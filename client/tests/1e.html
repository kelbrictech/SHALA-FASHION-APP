<!doctype html><meta charset="utf-8"><title>SHALA 1E PROVE</title><style>body{font-family:system-ui;max-width:1000px;margin:20px auto}.ok{color:green}.fail{color:red}iframe{width:420px;height:900px;border:1px solid #999}</style><h1>SHALA 1E PROVE</h1><div id="results"></div><iframe id="app" src="../1e.html"></iframe><script>
const expected=['SPLASH','DEDICATION','LOGIN','REGISTER ACCOUNT','FORGOT PASSWORD','DASHBOARD TEASER','BIRTHDAY GREETING','MAIN DASHBOARD','CREATE ME — FACE','CREATE ME — VITAL STATISTICS','IDENTITY GENERATING','CANON CONFIRMATION','DOUBLE CONFIRM','BODY SELF-SELECTION','WORKSHOP','POSE SELECTION','STUDIO SELECTION','CLOTHES','BAGS','SHOES','ACCESSORIES','ALBUS GENERATING','THE REVEAL','TREND ALERT','FAVORITES','COMPACT UNDERSIDE'];const results=[],out=document.querySelector('#results');function t(id,name,ok,detail=''){results.push({id,name,pass:!!ok,error:ok?'':detail});out.insertAdjacentHTML('beforeend',`<div>${id} — ${name}: <b class="${ok?'ok':'fail'}">${ok?'PASS':'FAIL'}</b> ${detail}</div>`)}const sleep=ms=>new Promise(r=>setTimeout(r,ms)),frame=document.querySelector('#app');frame.onload=async()=>{await sleep(250);const d=frame.contentDocument,label=()=>d.querySelector('#label')?.textContent.trim(),view=()=>d.querySelector('#view')?.innerText||'',next=async()=>{d.querySelector('#next').click();await sleep(15)},go=async target=>{let guard=0;while(label()!==target&&guard++<30)await next();return label()===target};t('1E-01','standalone shell loads',!!d.querySelector('.app')&&label()==='SPLASH');t('1E-02','page counter reports 26',d.querySelector('#count')?.textContent.trim()==='1 / 26');for(let i=0;i<expected.length;i++){if(i>0)await next();t(`1E-${String(i+3).padStart(2,'0')}`,`page ${i+1} ${expected[i]}`,label()===expected[i],`got ${label()}`)}await go('BODY SELF-SELECTION');t('1E-29','body self-selection has seven choices',d.querySelectorAll('#view .tile').length===7,`count ${d.querySelectorAll('#view .tile').length}`);await go('POSE SELECTION');t('1E-30','pose selection has ten choices',d.querySelectorAll('#view .tile').length===10,`count ${d.querySelectorAll('#view .tile').length}`);await go('STUDIO SELECTION');t('1E-31','studio selection has six choices incl My Studio',d.querySelectorAll('#view .tile').length===6&&/my studio/i.test(view()),`count ${d.querySelectorAll('#view .tile').length}`);await go('CLOTHES');t('1E-32','clothes provisions complete',['upload icon','camera icon','slap it','swap','skip','reference toggle','compact'].every(x=>view().toLowerCase().includes(x)),view());await go('ACCESSORIES');t('1E-33','four domain pages remain distinct',label()==='ACCESSORIES');await go('THE REVEAL');t('1E-34','reveal provisions complete',['heart icon','download icon','refresh icon','compact','reference toggle'].every(x=>view().toLowerCase().includes(x)),view());await go('FAVORITES');t('1E-35','favorites provisions complete',['favorite 1','favorite 2','favorite 3','compact','view toggle','download icon'].every(x=>view().toLowerCase().includes(x)),view());t('1E-36','desktop bypasses orientation gate',!d.querySelector('.gate'));window.__SHALA_1E_RESULTS__=results;const pass=results.filter(x=>x.pass).length;document.title=pass===36?'SHALA 1E PROVE — PASS / 36':'SHALA 1E PROVE — FAIL';const h=document.createElement('h2');h.textContent=`PROVE: ${pass} PASS / ${36-pass} FAIL`;out.prepend(h)};
</script>
