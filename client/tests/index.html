<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SHALA 1B Foundation PROVE</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;max-width:860px;margin:24px auto;padding:0 16px}.ok{color:green}.fail{color:red}</style>
</head>
<body>
  <h1>SHALA 1B Foundation PROVE</h1>
  <div id="results"></div>
  <script type="module">
    import * as storage from '../src/foundation/storage.js';

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    function report(name, ok, details='') {
      ok ? passed++ : failed++;
      const el = document.createElement('div');
      el.innerHTML = `${name}: <span class="${ok?'ok':'fail'}">${ok?'PASS':'FAIL'}</span> ${details}`;
      resultsEl.appendChild(el);
    }
    async function expectReject(fn, code) {
      try { await fn(); return false; } catch (e) { return e && e.message === code; }
    }
    async function rawSet(key, value) {
      const req = indexedDB.open('shala_v1', 1);
      const db = await new Promise((res, rej) => { req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
      await new Promise((res, rej) => {
        const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(value,key);
        tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
      });
      db.close();
    }

    async function runTests() {
      await storage.clearAll(); await storage.initStorage();
      const profile={schemaVersion:1,height:170,weight:65,selectedCanonId:'canon-a',birthdayGiftOpened:true};

      await storage.saveProfile(profile);
      let loaded=await storage.loadProfile();
      report('01 Profile persistence', loaded?.height===170 && loaded?.birthdayGiftOpened===true);

      report('02 Invalid profile rejected', await expectReject(()=>storage.saveProfile({height:'170'}),'invalid_profile'));
      report('03 Raw face cannot persist in profile', await expectReject(()=>storage.saveProfile({height:170,rawFaceMediaId:'face-raw'}),'invalid_profile'));

      await storage.clearAll(); await storage.initStorage();
      await storage.addFavorite({id:'f1'}); await storage.addFavorite({id:'f2'}); await storage.addFavorite({id:'f3'});
      report('04 Favorites cap stores three', (await storage.getFavorites()).length===3);
      report('05 Favorite #4 rejected', await expectReject(()=>storage.addFavorite({id:'f4'}),'favorites_limit_exceeded'));

      report('06 Invalid domain rejected', await expectReject(()=>storage.saveActiveBuild({selectedDomain:'INVALID'}),'invalid_active_build'));
      report('07 Invalid pose rejected', await expectReject(()=>storage.saveActiveBuild({selectedPoseId:'POSE_999'}),'invalid_active_build'));
      report('08 Invalid studio rejected', await expectReject(()=>storage.saveActiveBuild({selectedStudioId:'STUDIO_999'}),'invalid_active_build'));

      report('09 Reference cannot equal Root', await expectReject(()=>storage.saveActiveBuild({currentRootMediaPointer:'root-1',currentReferenceMediaPointer:'root-1'}),'invalid_active_build'));
      report('10 Candidate cannot equal Root before PASS', await expectReject(()=>storage.saveActiveBuild({currentRootMediaPointer:'root-1',candidateMediaPointer:'root-1'}),'invalid_active_build'));

      await storage.saveProfile(profile); await storage.saveActiveBuild({selectedDomain:'CLOTHES',currentRootMediaPointer:'root-1',currentReferenceMediaPointer:'ref-1',candidateMediaPointer:'cand-1',comparisonEnabled:true});
      await storage.startAgain();
      report('11 START AGAIN preserves persistent state', (await storage.loadProfile())?.height===170 && (await storage.getFavorites()).length===3 && (await storage.loadActiveBuild())===null);

      await storage.saveActiveBuild({selectedDomain:'BAGS',currentRootMediaPointer:'root-2'});
      await storage.nuclearReset();
      loaded=await storage.loadProfile();
      let meta=await storage.getMeta();
      report('12 NUCLEAR RESET destroys profile/build', loaded===null && (await storage.loadActiveBuild())===null);
      report('13 NUCLEAR RESET preserves Favorites + birthday after reload', (await storage.getFavorites()).length===3 && meta.birthdayGiftOpened===true);

      await rawSet('profile','not-an-object');
      report('14 Malformed profile recovers deterministically', (await storage.loadProfile())===null && (await storage.getMeta()).recoveryStatus==='INVALID_PROFILE');

      await storage.clearAll(); await storage.initStorage();
      await rawSet('meta',{schemaVersion:999,birthdayGiftOpened:true});
      report('15 Incompatible schema fails closed without crash', (await storage.loadProfile())===null && (await storage.getMeta()).recoveryStatus==='SCHEMA_MISMATCH' && (await storage.getMeta()).birthdayGiftOpened===true);

      const summary=document.createElement('h2');
      summary.id='summary'; summary.textContent=`PROVE: ${passed} PASS / ${failed} FAIL`;
      summary.className=failed?'fail':'ok'; resultsEl.prepend(summary);
      document.title=`SHALA 1B PROVE — ${passed} PASS / ${failed} FAIL`;
    }
    runTests().catch(e=>report('UNHANDLED TEST ERROR',false,e.message));
  </script>
</body>
</html>
