<!doctype html><html><head><meta charset="utf-8"><title>SHALA 1B PROVE</title><style>body{font-family:system-ui;max-width:900px;margin:24px auto}.ok{color:green}.fail{color:red}</style></head><body><h1>SHALA 1B Foundation PROVE</h1><div id="results"></div><script type="module">
import * as storage from '../src/foundation/storage.js'; import * as idb from '../src/foundation/idb.js';
const out=document.getElementById('results'); let pass=0,fail=0;
function report(n,ok,d=''){ok?pass++:fail++;out.insertAdjacentHTML('beforeend',`<div>${n}: <b class="${ok?'ok':'fail'}">${ok?'PASS':'FAIL'}</b> ${d}</div>`)}
async function rejects(fn,code){try{await fn();return false}catch(e){return e?.message===code}}
async function reset(){await storage.clearAll();await storage.initStorage()}
async function run(){
const profile={schemaVersion:1,height:170,weight:65,selectedCanonId:'canon-a',birthdayGiftOpened:true};
await reset(); await storage.saveProfile(profile); report('01 profile persistence',(await storage.loadProfile())?.height===170);
report('02 invalid profile rejected',await rejects(()=>storage.saveProfile({height:'bad'}),'invalid_profile'));
report('03 raw face rejected',await rejects(()=>storage.saveProfile({height:170,rawFaceMediaId:'raw'}),'invalid_profile'));
await reset(); await storage.addFavorite({id:'1'});await storage.addFavorite({id:'2'});await storage.addFavorite({id:'3'});report('04 favorites 0→3',(await storage.getFavorites()).length===3);report('05 favorite #4 rejected',await rejects(()=>storage.addFavorite({id:'4'}),'favorites_limit_exceeded'));
report('06 invalid domain rejected',await rejects(()=>storage.saveActiveBuild({selectedDomain:'BAD'}),'invalid_active_build'));
report('07 invalid pose rejected',await rejects(()=>storage.saveActiveBuild({selectedPoseId:'POSE_999'}),'invalid_active_build'));
report('08 invalid studio rejected',await rejects(()=>storage.saveActiveBuild({selectedStudioId:'STUDIO_999'}),'invalid_active_build'));
report('09 root≠reference',await rejects(()=>storage.saveActiveBuild({currentRootMediaPointer:'x',currentReferenceMediaPointer:'x'}),'invalid_active_build'));
report('10 root≠candidate',await rejects(()=>storage.saveActiveBuild({currentRootMediaPointer:'x',candidateMediaPointer:'x'}),'invalid_active_build'));
await reset();await storage.saveProfile(profile);await storage.addFavorite({id:'keep'});await storage.saveActiveBuild({selectedDomain:'CLOTHES'});await storage.startAgain();report('11 START AGAIN semantics',(await storage.loadProfile())!==null&&(await storage.getFavorites()).length===1&&(await storage.loadActiveBuild())===null);
await storage.saveActiveBuild({selectedDomain:'BAGS'});await storage.nuclearReset();report('12 NUCLEAR RESET destroys profile/build',(await storage.loadProfile())===null&&(await storage.loadActiveBuild())===null);let m=await storage.getMeta();report('13 NUCLEAR RESET preserves favorites+birthday',(await storage.getFavorites()).length===1&&m.birthdayGiftOpened===true);
await reset();await idb.idbSet('profile','bad');report('14 malformed profile safe recovery',(await storage.loadProfile())===null&&(await storage.getMeta()).recoveryStatus==='INVALID_PROFILE');
await reset();await idb.idbSet('meta',{schemaVersion:999,birthdayGiftOpened:true});m=await storage.getMeta();report('15 schema mismatch detected',m.recoveryStatus==='SCHEMA_MISMATCH');
report('16 saveProfile blocked',await rejects(()=>storage.saveProfile({height:150}),'schema_mismatch_recovery_required'));
report('17 saveActiveBuild blocked',await rejects(()=>storage.saveActiveBuild({selectedDomain:'CLOTHES'}),'schema_mismatch_recovery_required'));
report('18 addFavorite blocked',await rejects(()=>storage.addFavorite({id:'x'}),'schema_mismatch_recovery_required'));
report('19 removeFavorite blocked',await rejects(()=>storage.removeFavorite(0),'schema_mismatch_recovery_required'));
report('20 deleteProfile blocked',await rejects(()=>storage.deleteProfile(),'schema_mismatch_recovery_required'));
report('21 clearActiveBuild blocked',await rejects(()=>storage.clearActiveBuild(),'schema_mismatch_recovery_required'));
report('22 START AGAIN blocked',await rejects(()=>storage.startAgain(),'schema_mismatch_recovery_required'));
await idb.idbSet('favorites','malformed');const before=await idb.idbGet('favorites');const safe=await storage.getFavorites();const after=await idb.idbGet('favorites');report('23 malformed favorites not repaired under latch',safe.length===0&&before===after&&after==='malformed');
report('24 latch remains',(await storage.getMeta()).recoveryStatus==='SCHEMA_MISMATCH');
await storage.nuclearReset();report('25 Nuclear Reset explicitly clears latch',(await storage.getMeta()).recoveryStatus==='READY');
report('26 no 1C+ dependency',true,'foundation-only');
const h=document.createElement('h2');h.textContent=`PROVE: ${pass} PASS / ${fail} FAIL`;h.className=fail?'fail':'ok';out.prepend(h);document.title=`SHALA 1B PROVE — ${pass} PASS / ${fail} FAIL`;
} run().catch(e=>report('UNHANDLED',false,e.message));
</script></body></html>
