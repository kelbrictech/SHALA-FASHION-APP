<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SHALA Visible Shell — 1E (low-fi)</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>SHALA — V1 Visible Shell (low-fidelity)</h1>
      <div id="status">Initializing…</div>
    </header>
    <main class="layout">
      <aside class="red">
        <h2>RED — Controls</h2>
        <div id="screenLabel"></div>
        <div id="controls"></div>
        <h3>Compact / Home</h3>
        <div id="compactArea"></div>
        <h3>Favorites</h3>
        <ul id="favoritesList"></ul>
      </aside>
      <section class="blue">
        <h2>BLUE — Studio Viewport</h2>
        <div id="blueViewport" class="viewport">Studio viewport placeholder</div>
        <div id="studioControls"></div>
        <div id="referenceArea"></div>
      </section>
    </main>
    <footer>
      <small>Low-fidelity shell — FDR-3 compliant. No external services.</small>
    </footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
