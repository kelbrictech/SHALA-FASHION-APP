<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHALA V1 — CSV Authority Shell</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font:14px Arial;color:#111}.app{width:min(390px,100%);min-height:100vh;margin:auto;background:#fafafa}
.bar{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111}.page{padding:16px;min-height:760px}
.box,.btn,.tile,input{border:2px solid #111;background:#fff;padding:12px;margin:8px 0}.btn{width:100%;cursor:pointer}.yes{background:#dff2df}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.image{height:240px;display:flex;align-items:center;justify-content:center;text-align:center}
.compact{border:4px solid #111;border-radius:45% 45% 20% 20%;padding:28px 16px;text-align:center}.center{min-height:650px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.dialog{border:3px double #111;padding:12px;margin-top:12px}.muted{opacity:.65}.hidden{display:none}input{width:100%}.tiny{font-size:12px}
</style>
</head>
<body>
<main class="app"><header class="bar"><b>SHALA · V1</b><span id="label"></span></header><section id="view" class="page"></section></main>
<script type="module">
import {POSES,STUDIOS} from './src/foundation/schema.js';

const V=document.querySelector('#view'), L=document.querySelector('#label');
const bodyNames=['Hourglass','Bottom Hourglass','Top Hourglass','Pear','Inverted Triangle','Rectangle','Apple'];
const studioNames={STUDIO_01:'indoor office',STUDIO_02:'indoor living room',STUDIO_03:'indoor disco',STUDIO_04:'outdoor sunny patio',STUDIO_05:'outdoor golden hour',MY_STUDIO:'my studio'};
const poseNames=['Whole Body 1 — Neutral Standing','Whole Body 2 — Fashion Stance','Upper Torso 1 — Front View','Upper Torso 2 — 3/4 View','Lower Body 1 — Front View','Lower Body 2 — Stance View','Seated 1 — Front View','Seated 2 — 3/4 View','Side Profile','Back View'];

window.pages=[
'SPLASH','DEDICATION','LOGIN','REGISTER ACCOUNT','FORGOT PASSWORD','DASHBOARD TEASER','BIRTHDAY GREETING','COMPACT CLOSE','COMPACT OPEN',
'CREATE ME — FACE','CREATE ME — VITAL STATISTICS','IDENTITY GENERATING','CANON CONFIRMATION','DOUBLE CONFIRM','BODY SELF-SELECTION',
'WORKSHOP','POSE SELECTION','STUDIO SELECTION','CLOTHES','BAGS','SHOES','ACCESSORIES','ALBUS GENERATING','THE REVEAL','TREND ALERT','FAVORITES','COMPACT UNDERSIDE'
];

let page=1, timer=null, selected=null, confirmOpen=false, mirrorOpen=false, favHidden=false, resetWarn=false;
const go=n=>{clearTimeout(timer);page=n;selected=null;confirmOpen=false;draw();};
const btn=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;
const compact=()=>btn('compact','compact');
const sourcePage=(title,n)=>`<h1>${title}</h1><div class="box image">Page ${n} · evolving composite</div>
${btn('upload icon','source')}${btn('camera icon','source')}${btn('slap it','slap','yes')}${btn('swap','swap')}${btn('skip','skip')}
${btn('reference toggle','reference')}${compact()}${btn('done here','done','yes')}
${confirmOpen?`<div class="dialog"><b>Done here?</b>${btn('yes pls','stage-yes','yes')}${btn('not quite','stage-no')}</div>`:''}`;

function markup(){
 switch(page){
 case 1:return `<div class="center"><h1>SHALA</h1><div class="box image">page 1</div>${btn('tap me','tap')}</div>`;
 case 2:timer=setTimeout(()=>go(3),5000);return `<div class="center"><h1>Ang app para kay RASYELA</h1><div class="box image">page 2</div><p class="muted">Continuing in 5 seconds…</p></div>`;
 case 3:return `<h1>Login</h1><input id="username" placeholder="username"><input id="password" type="password" placeholder="password">${btn('open sesame','login','yes')}${btn('sign me up!','signup')}${btn('I forgot!','forgot')}`;
 case 4:return `<h1>Register Account</h1><input placeholder="name me"><input type="password" placeholder="lock me"><input type="password" placeholder="double check me">${btn('all done!','register','yes')}${btn('bring me back','back-login')}<p class="tiny">Account recovery phrase is generated locally. SHALA does not rely on server-stored account recovery information.</p>`;
 case 5:return `<h1>Forgot Password</h1><input placeholder="enter magic words">${btn('pray this works','recovery','yes')}${btn('bring me back','back-login')}`;
 case 6:return `<h1>Dashboard Teaser</h1><div class="box image">envelop clipart</div>${btn('envelop clipart','envelope','yes')}`;
 case 7:return `<h1>Birthday Greeting</h1><div class="box image">birthday greeting</div>${btn('heart icon','greeting-heart','yes')}`;
 case 8:return `<div class="compact"><h1>Compact Closed</h1><div class="box image">closed compact</div>${btn('open me','open-compact','yes')}${btn('flip me','flip')}</div>`;
 case 9:return `<div class="compact"><h1>Compact Open</h1>${mirrorOpen?'<div class="box image">FRONT CAMERA / MIRROR VIEW</div>':''}${btn('mirror on the wall','mirror')}${btn('explore','explore','yes')}${btn('trends','trends')}${btn('favorites','favorites')}${btn('close me up','close-compact')}</div>`;
 case 10:return `<h1>Create Me — Face</h1><div class="box image">face input preview</div>${btn('upload face','face')}${btn('take a pic','face')}${btn('use this pic','use-face','yes')}<p class="tiny">“use this pic” commits the entered identity input to onboarding state and continues.</p>`;
 case 11:return `<h1>Create Me — Vital Statistics</h1><div class="grid"><input placeholder="cm"><input placeholder="ft in"><input placeholder="kg"><input placeholder="lb"></div><input placeholder="bust"><input placeholder="waist"><input placeholder="hips">${btn('this looks right','vitals','yes')}<p class="tiny">Commits the entered identity input to onboarding state and continues.</p>`;
 case 12:timer=setTimeout(()=>go(13),1200);return `<div class="center"><h1>Identity Generating</h1><div class="box image">ALBUS is doing the math…</div></div>`;
 case 13:return `<h1>Canon Confirmation</h1><div class="box image">generated canonical SHALA self</div>${btn('spot on!','spot','yes')}${btn('not quite','not-quite')}`;
 case 14:return `<h1>Double Confirm</h1><div class="box image">generated canonical SHALA self</div>${btn('NA-AH!','na-ah')}${btn('Fine!','fine')}${btn('the body tho','body','yes')}`;
 case 15:return `<h1>Body Self-Selection</h1><div class="grid">${bodyNames.map((x,i)=>`<button class="tile" data-action="select" data-value="body${i+1}">body${i+1}<br><small>${x}</small></button>`).join('')}</div>${btn('this one','body-confirm')}${confirmOpen?`<div class="dialog">${btn('yes pls','body-yes','yes')}${btn('pick again','body-again')}</div>`:''}`;
 case 16:return `<h1>Workshop</h1><div class="box image">workshop / rack sliders</div>${compact()}${btn('clothes rack','noop')}${btn('try me clothes','focus')}${btn('try me bags','focus')}${btn('shoes rack','noop')}${btn('try me shoes','focus')}${btn('bookshelf','noop')}${btn('try me accessories','focus')}${btn('yes pls','workshop-yes','yes')}${btn('pick again','pick-again')}`;
 case 17:return `<h1>Pose Selection</h1><div class="grid">${POSES.map((x,i)=>`<button class="tile" data-action="select" data-value="${x}">pose${i+1}<br><small>${poseNames[i]}</small></button>`).join('')}</div>${btn('yes pls','pose-yes','yes')}${btn('pick again','pick-again')}${compact()}`;
 case 18:return `<h1>Studio Selection</h1><div class="grid">${STUDIOS.map(x=>`<button class="tile" data-action="select" data-value="${x}">${studioNames[x]}</button>`).join('')}</div>${btn('yes pls','studio-yes','yes')}${btn('pick again','pick-again')}${compact()}`;
 case 19:return sourcePage('Clothes',19);
 case 20:return sourcePage('Bags',20);
 case 21:return sourcePage('Shoes',21);
 case 22:return sourcePage('Accessories',22);
 case 23:timer=setTimeout(()=>go(24),1200);return `<div class="center"><h1>ALBUS Generating</h1><div class="box image">wait while processing</div></div>`;
 case 24:return `<h1>The Reveal</h1><div class="box image">final generated look</div>${btn('heart icon','heart')}${btn('download icon','download')}${btn('refresh icon','refresh')}${compact()}${btn('reference toggle','reference')}`;
 case 25:return `<h1>Trend Alert</h1><div class="box image">trend gacha</div>${btn('roll again','roll')}${btn("that's interesting",'interesting','yes')}${compact()}`;
 case 26:return `<h1>Favorites</h1><div class="${favHidden?'hidden':''}"><div class="box">favorite 1</div><div class="box">favorite 2</div><div class="box">favorite 3</div>${compact()}${btn('view toggle','view')}${btn('download icon','download')}</div>${favHidden?'<div class="box image" data-action="view">tap/click screen to view icons again</div>':''}`;
 case 27:return `<h1>Compact Underside</h1><div class="box image">compact underside</div>${compact()}${btn('no-no button','no-no')}${resetWarn?`<div class="dialog"><b>Factory reset will erase SHALA data.</b>${btn('i understand','reset','yes')}${btn('go back','reset-back')}</div>`:''}`;
 }
}
function draw(){L.textContent=`Page ${page} · ${window.pages[page-1]}`;V.innerHTML=markup();}
V.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]'); if(!el)return;
 const a=el.dataset.action;
 if(a==='tap')go(2); else if(a==='login')go(6); else if(a==='signup')go(4); else if(a==='forgot')go(5); else if(a==='back-login')go(3);
 else if(a==='register')alert('Recovery phrase generated locally. Store it safely.'); else if(a==='recovery')go(4);
 else if(a==='envelope')go(7); else if(a==='greeting-heart'){timer=setTimeout(()=>go(8),3000);}
 else if(a==='open-compact')go(9); else if(a==='flip')go(27); else if(a==='close-compact')go(8);
 else if(a==='mirror'){mirrorOpen=!mirrorOpen;draw();} else if(a==='explore')go(10); else if(a==='trends')go(25); else if(a==='favorites')go(26);
 else if(a==='face'){selected='face';} else if(a==='use-face')go(11); else if(a==='vitals')go(12);
 else if(a==='spot')go(16); else if(a==='not-quite')go(14); else if(a==='na-ah')go(10); else if(a==='fine')go(16); else if(a==='body')go(15);
 else if(a==='select'){selected=el.dataset.value;confirmOpen=true;draw();} else if(a==='body-confirm'){confirmOpen=true;draw();} else if(a==='body-yes')go(16); else if(a==='body-again'){selected=null;confirmOpen=false;draw();}
 else if(a==='focus'){selected=el.textContent.trim();confirmOpen=true;} else if(a==='workshop-yes')go(17); else if(a==='pose-yes')go(18); else if(a==='studio-yes')go(19);
 else if(a==='compact')go(9); else if(a==='done'){confirmOpen=true;draw();} else if(a==='stage-no'){confirmOpen=false;draw();} else if(a==='stage-yes'||a==='skip')go(page+1);
 else if(a==='refresh')go(16); else if(a==='roll')draw(); else if(a==='interesting')window.open('about:blank','_blank');
 else if(a==='view'){favHidden=!favHidden;draw();} else if(a==='no-no'){resetWarn=true;draw();} else if(a==='reset-back'){resetWarn=false;draw();} else if(a==='reset'){go(1);}
});
draw();
</script></body></html>
