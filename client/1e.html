<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHALA V1 — The Shell</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd;font:14px Arial;color:#111}.app{width:min(390px,100%);min-height:100vh;margin:auto;background:#fafafa}.bar,.nav{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111}.nav{border-top:2px solid #111;border-bottom:0}.page{padding:16px;min-height:720px}.box,.btn,.tile,input{border:2px solid #111;background:#fff;padding:12px;margin:8px 0}.btn{width:100%;cursor:pointer}.yes{background:#dff2df}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.image{height:260px;display:flex;align-items:center;justify-content:center}.compact{border:4px solid #111;border-radius:45% 45% 20% 20%;padding:28px 16px;text-align:center}.center{min-height:650px;display:flex;flex-direction:column;justify-content:center;text-align:center}.gate{position:fixed;inset:0;background:#111;color:#fff;z-index:9;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}input{width:100%}</style></head><body><main class="app"><header class="bar"><b>SHALA · V1 THE SHELL</b><span id="label"></span></header><section id="view" class="page"></section><nav class="nav"><button id="prev">←</button><span id="count"></span><button id="next">→</button></nav></main><script type="module">import{DOMAINS,POSES,STUDIOS}from'./src/foundation/schema.js';const V=document.querySelector('#view'),L=document.querySelector('#label'),C=document.querySelector('#count');let n=0;const bodies=Array.from({length:7},(_,i)=>`<button class="tile">body${i+1}</button>`).join('');const poses=POSES.map((_,i)=>`<button class="tile">pose${i+1}</button>`).join('');const names={STUDIO_01:'indoor office',STUDIO_02:'indoor living room',STUDIO_03:'indoor disco',STUDIO_04:'outdoor sunny patio',STUDIO_05:'outdoor golden hour',MY_STUDIO:'my studio'};const studios=STUDIOS.map(x=>`<button class="tile">${names[x]||x}</button>`).join('');const ref=(d,i)=>[d,`<h1>${d}</h1><div class="box image">IMAGE ${i+3}</div><button class="btn">upload icon</button><button class="btn">camera icon</button><button class="btn yes">slap it</button><button class="btn">swap</button><button class="btn">skip</button><button class="btn">reference toggle</button><button class="btn">compact</button>`];const pages=[['SPLASH','<div class="center"><h1>SHALA</h1><div class="box image">page 1</div><button class="btn">tap me</button></div>'],['DEDICATION','<div class="center"><h1>Ang app para kay RASYELA</h1><div class="box image">page 2</div></div>'],['LOGIN','<h1>Login</h1><div class="box image">page 3</div><input placeholder="username"><input placeholder="password" type="password"><button class="btn yes">open sesame</button><button class="btn">sign me up!</button><button class="btn">I forgot!</button>'],['REGISTER ACCOUNT','<h1>Register Account</h1><div class="box image">page 3</div><input placeholder="name me"><input placeholder="lock me"><input placeholder="double check me"><button class="btn yes">all done!</button><button class="btn">bring me back</button>'],['FORGOT PASSWORD','<h1>Forgot Password</h1><div class="box image">page 3</div><input placeholder="enter magic words"><button class="btn yes">pray this works</button><button class="btn">bring me back</button>'],['DASHBOARD TEASER','<h1>Dashboard Teaser</h1><div class="box image">page 6</div><button class="btn">envelop clipart</button>'],['BIRTHDAY GREETING','<h1>Birthday Greeting</h1><div class="box image">page 7</div><button class="btn yes">heart icon</button>'],['COMPACT CLOSE','<div class="compact"><h1>Compact Close</h1><div class="box image">page 8</div><button class="btn">cover flip</button></div>'],['COMPACT OPEN','<div class="compact"><h1>Compact Open</h1><div class="box image">page 8</div><button class="btn">vertical carousel</button><button class="btn">mirror on the wall</button><button class="btn">explore</button><button class="btn">trends</button><button class="btn">favorites</button></div>'],['CREATE ME — FACE','<h1>Create Me — Face</h1><div class="box image">page 9</div><button class="btn">upload face</button><button class="btn">take a pic</button><button class="btn yes">use this pic</button>'],['CREATE ME — VITAL STATISTICS','<h1>Vital Statistics</h1><div class="box image">page 9</div><div class="grid"><button class="btn">cm</button><button class="btn">ft in</button><button class="btn">kg</button><button class="btn">lb</button></div><input placeholder="bust"><input placeholder="waist"><input placeholder="hips"><button class="btn yes">this looks right</button>'],['IDENTITY GENERATING','<h1>Identity Generating</h1><div class="box image">page 9</div><p>ALBUS is doing the math...</p>'],['CANON CONFIRMATION','<h1>Does this resemble you?</h1><div class="box image">page 9</div><button class="btn yes">spot on!</button><button class="btn">not quite</button>'],['DOUBLE CONFIRM','<h1>Really, gurl?</h1><div class="box image">page 9</div><button class="btn">NA-AH!</button><button class="btn">Fine!</button><button class="btn yes">the body tho</button>'],['BODY SELF-SELECTION',`<h1>Body Self-Selection</h1><div class="box image">page 9</div><div class="grid">${bodies}</div><button class="btn">this one</button><button class="btn yes">yes pls</button><button class="btn">pick again</button>`],['WORKSHOP','<h1>Workshop</h1><div class="box image">page 10</div><button class="btn">compact</button><button class="btn">clothes rack</button><button class="btn">try me clothes</button><button class="btn">try me bags</button><button class="btn">shoes rack</button><button class="btn">try me shoes</button><button class="btn">bookshelf</button><button class="btn">try me accessories</button><button class="btn yes">yes pls</button><button class="btn">pick again</button>'],['POSE SELECTION',`<h1>Pose Selection</h1><div class="box image">page 10</div><div class="grid">${poses}</div><button class="btn yes">yes pls</button><button class="btn">pick again</button><button class="btn">compact</button>`],['STUDIO SELECTION',`<h1>Studio Selection</h1><div class="box image">page 11</div><div class="grid">${studios}</div><button class="btn yes">yes pls</button><button class="btn">pick again</button><button class="btn">compact</button>`],...DOMAINS.map(ref),['ALBUS GENERATING','<h1>ALBUS is doing the math...</h1><div class="box image">page 22</div>'],['THE REVEAL','<h1>The Reveal</h1><div class="box image">IMAGE Y</div><button class="btn">heart icon</button><button class="btn">download icon</button><button class="btn">refresh icon</button><button class="btn">compact</button><button class="btn">reference toggle</button>'],['TREND ALERT','<h1>Trend Alert</h1><div class="box image">page 24</div><button class="btn">roll again</button><button class="btn yes">that\'s interesting</button><button class="btn">compact</button>'],['FAVORITES','<h1>Favorites</h1><div class="box">favorite 1</div><div class="box">favorite 2</div><div class="box">favorite 3</div><button class="btn">compact</button><button class="btn">view toggle</button><button class="btn">download icon</button>'],['COMPACT UNDERSIDE','<h1>Compact Underside</h1><div class="box image">page 26</div><button class="btn">compact</button><button class="btn">no-no button</button>']];window.pages=pages.map(x=>x[0]);function mobile(){return/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||matchMedia('(hover:none) and (pointer:coarse)').matches}function gate(){document.querySelector('.gate')?.remove();if(['THE REVEAL','FAVORITES'].includes(pages[n][0])&&mobile()&&innerHeight>innerWidth){const g=document.createElement('div');g.className='gate';g.innerHTML='<div><h2>Shift to landscape mode</h2><p>Rotate your phone to continue.</p></div>';document.body.append(g)}}function draw(){L.textContent=pages[n][0];C.textContent=`${n+1} / ${pages.length}`;V.innerHTML=pages[n][1];gate()}document.querySelector('#prev').onclick=()=>{n=(n-1+pages.length)%pages.length;draw()};document.querySelector('#next').onclick=()=>{n=(n+1)%pages.length;draw()};addEventListener('resize',gate);addEventListener('orientationchange',gate);draw();</script></body></html>
