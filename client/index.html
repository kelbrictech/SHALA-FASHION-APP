<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SHALA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d0b09;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif}#app{position:relative;width:min(100vw,430px,100vh*375/812);height:min(100vh,100vw*812/375);aspect-ratio:375/812;margin:auto;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.page{position:absolute;inset:0;display:none;background-size:100% 100%;background-position:center;background-repeat:no-repeat}.page.active{display:block}.hit{position:absolute;background:transparent;border:0;cursor:pointer}input{position:absolute;background:transparent;border:0;outline:0;color:#f7efe4;font:16px Georgia,serif;text-align:center}#key{position:absolute;left:3.5%;bottom:3.2%;z-index:9;border:0;background:rgba(0,0,0,.2);font-size:24px;border-radius:50%;width:42px;height:42px;cursor:pointer}.drawer{left:37.6%;width:24%}#login-user{left:34.5%;top:19.6%;width:31%;height:4%}#login-pass{left:34.5%;top:26.4%;width:30%;height:4%}#open{top:51.43%;height:9.2%}#signup{top:62.26%;height:8.12%}#forgot{top:72.01%;height:7.58%}#reg-name{left:35.25%;top:18.41%;width:30%;height:3.2%}#reg-pass{left:35.25%;top:22.63%;width:30%;height:3.6%}#reg-check{left:35.25%;top:27.07%;width:30%;height:3.8%}#all-done{left:48.18%;top:51.98%;width:24%;height:11.91%}#bring-back{left:48.18%;top:63.89%;width:24%;height:11.91%}#phrase{left:35.25%;top:22.47%;width:30%;height:4%}#pray{left:48.18%;top:51.98%;width:24%;height:11.91%}#forgot-back{left:48.18%;top:63.89%;width:24%;height:11.91%}#envelope{left:53%;top:68.5%;width:22%;height:14%;border-radius:50%;box-shadow:0 0 0 0 rgba(232,201,138,.45);animation:pulse 1.8s infinite}@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(232,201,138,0)}100%{box-shadow:0 0 0 0 rgba(232,201,138,0)}}#heart{left:43%;top:62%;width:14%;height:10%}#mirror{position:absolute;left:22.8%;top:14.73%;width:53.47%;height:23.17%;overflow:hidden}#mirror img{width:100%;height:100%;object-fit:cover;display:none}.actionrow{position:absolute;top:42%;left:0;right:0;display:flex;justify-content:center;gap:22px}.action{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#e8c98a;cursor:pointer}.circle{width:54px;height:54px;border-radius:50%;border:1px solid rgba(232,201,138,.55);background:rgba(28,22,17,.72);display:flex;align-items:center;justify-content:center;font-size:24px}.label{font-size:11px;color:#d8cbb8}#usepic{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;padding:14px 44px;border-radius:999px;border:0;background:linear-gradient(#d9a94a,#b9812e);font-weight:700;cursor:pointer}#usepic:disabled{opacity:.38;cursor:not-allowed}#file{display:none}#cam{position:absolute;inset:0;background:#000;display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column}#cam video{width:82%;max-height:65%;object-fit:cover;border:2px solid #c9a45f}#shutter{width:64px;height:64px;border-radius:50%;margin-top:24px;border:4px solid #c9a45f}#cancel{margin-top:18px;background:none;border:0;color:#ddd}</style></head><body><div id="app">
<div id="p1" class="page active"></div><div id="p2" class="page"></div>
<div id="p3" class="page"><input id="login-user" autocomplete="off"><input id="login-pass" type="password" autocomplete="off"><button id="open" class="hit drawer"></button><button id="signup" class="hit drawer"></button><button id="forgot" class="hit drawer"></button><button id="key">🔑</button></div>
<div id="p4" class="page"><input id="reg-name" autocomplete="off"><input id="reg-pass" type="password"><input id="reg-check" type="password"><button id="all-done" class="hit"></button><button id="bring-back" class="hit"></button></div>
<div id="p5" class="page"><input id="phrase" autocomplete="off"><button id="pray" class="hit"></button><button id="forgot-back" class="hit"></button></div>
<div id="p6" class="page"><button id="envelope" class="hit"></button></div><div id="p7" class="page"><button id="heart" class="hit"></button></div>
<div id="p8" class="page"><div id="mirror"><img id="mirrorimg"></div><div class="actionrow"><button id="upload" class="action"><span class="circle">⇧</span><span class="label">upload pic</span></button><button id="take" class="action"><span class="circle">◉</span><span class="label">take a pic</span></button></div><button id="usepic" disabled aria-disabled="true">use this pic</button><input id="file" type="file" accept="image/*"><div id="cam"><video id="video" autoplay playsinline></video><button id="shutter"></button><button id="cancel">cancel</button></div></div></div>
<script src="p1.js"></script><script src="p2.js"></script><script src="p3.js"></script><script src="p4.js"></script><script src="p5.js"></script><script src="p6.js"></script><script src="p7.js"></script><script src="p8.js"></script><script src="app.js"></script></body></html>
